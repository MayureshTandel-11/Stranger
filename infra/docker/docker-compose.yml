version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: stranger-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: stranger-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  ollama-data:
  qdrant-data:
