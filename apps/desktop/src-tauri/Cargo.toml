[package]
name = "stranger-desktop"
version = "0.1.0"
description = "Stranger desktop shell"
authors = ["Stranger Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

