[package]
name = "stranger-desktop"
version = "0.1.0"
description = "Stranger desktop shell"
authors = ["Stranger Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
